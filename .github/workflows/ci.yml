name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  analyze-flutter:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: |
          cd apps/admin_flutter && flutter pub get && flutter analyze
          cd ../candidate_flutter && flutter pub get && flutter analyze
          cd ../../packages/talentos_design_system && flutter pub get && flutter analyze

  lint-node:
    name: Node.js Lint & Prisma
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - run: |
          cd services/api && npm install && npx tsc --noEmit
          npx prisma validate
          cd ../worker && npm install && npx tsc --noEmit
