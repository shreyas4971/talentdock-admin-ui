name = "talentdock-api-worker"
main = "src/index.ts"
compatibility_date = "2024-05-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
CORS_ORIGINS = "*"

[[d1_databases]]
binding = "DB"
database_name = "talentdock-db"
database_id = "f38d3842-4ad5-4bdb-9807-d8ae56c91bfc"
migrations_dir = "drizzle"

[[r2_buckets]]
binding = "RESUMES_BUCKET"
bucket_name = "talentdock-resumes"
preview_bucket_name = "talentdock-resumes-local"
